<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Minimalist Barbell (Dark Theme) -->
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#a855f7"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="#111111"/>
  <!-- Barbell -->
  <rect x="8" y="22" width="10" height="20" rx="3" fill="url(#grad)"/>
  <rect x="46" y="22" width="10" height="20" rx="3" fill="url(#grad)"/>
  <rect x="16" y="28" width="32" height="8" rx="2" fill="url(#grad)"/>
  <!-- Weight plates -->
  <rect x="4" y="18" width="6" height="28" rx="2" fill="url(#grad)" opacity="0.8"/>
  <rect x="54" y="18" width="6" height="28" rx="2" fill="url(#grad)" opacity="0.8"/>
</svg>
